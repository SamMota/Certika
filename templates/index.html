<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Certificados</title>
    <!-- Fonte Plus Jakarta Sans (Estilo SaaS Moderno) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Navbar Minimalista -->
    <header class="navbar">
        <div class="brand">
            <span class="logo-icon">📜</span>
            <span class="brand-name">Certika.</span>
        </div>
        <div class="nav-tag">
            <span class="pill-badge">PRO EDITION • CMYK & RGB</span>
        </div>
    </header>

    <main class="main-container">
        <!-- Cabeçalho Principal -->
        <section class="hero-section">
            <div class="pill-badge-green">EMISSÃO EM LOTE INTELIGENTE</div>
            <h1 class="hero-title">Emissão de certificados no seu ritmo.</h1>
            <p class="hero-subtitle">Gere certificados em alta resolução prontos para impressão gráfica ou envio digital
                em poucos segundos.</p>
        </section>

        <form method="POST" enctype="multipart/form-data" class="app-form">

            <div class="grid-layout">
                <!-- Coluna Esquerda: Configurações & Modelo -->
                <div class="card card-main">
                    <div class="card-header">
                        <span class="step-number">01</span>
                        <h2>Modelo de Certificado</h2>
                    </div>

                    <div class="toggle-group">
                        <label class="toggle-btn active" id="lbl-lista">
                            <input type="radio" name="origem_modelo" value="lista" checked
                                onclick="toggleModelo('lista')">
                            Modelos Salvos
                        </label>
                        <label class="toggle-btn" id="lbl-upload">
                            <input type="radio" name="origem_modelo" value="upload" onclick="toggleModelo('upload')">
                            Upload Manual
                        </label>
                    </div>

                    <div id="box-lista" class="input-block">
                        <label class="field-label">Selecione o modelo base</label>
                        <select name="modelo_lista" class="custom-select">
                            {% for m in modelos %}
                            <option value="{{ m }}">{{ m }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div id="box-upload" class="input-block" style="display: none;">
                        <label class="field-label">Envie sua imagem (.png, .jpg)</label>
                        <input type="file" name="file_upload" accept="image/*" class="custom-file">
                    </div>

                    <div class="card-divider"></div>

                    <div class="card-header">
                        <span class="step-number">02</span>
                        <h2>Ajustes Tipográficos</h2>
                    </div>

                    <div class="form-grid">
                        <div class="input-block">
                            <label class="field-label">Formatação do Nome</label>
                            <select name="formato_nome" id="formato_nome" class="custom-select">
                                <option value="original">Como foi digitado</option>
                                <option value="upper">CAIXA ALTA (MARIA DA SILVA)</option>
                                <option value="title" selected>Primeiras Letras Maiúsculas (Maria Da Silva)</option>
                            </select>
                        </div>

                        <div class="input-block">
                            <label class="field-label">Tamanho da Fonte</label>
                            <input type="number" name="font_size" value="60" class="custom-input">
                        </div>

                        <div class="input-block">
                            <label class="field-label">Posição Vertical (Y)</label>
                            <input type="number" step="0.1" name="pos_y_factor" value="2.5" class="custom-input">
                        </div>

                        <div class="input-block">
                            <label class="field-label">Perfil de Cor</label>
                            <select name="modo_cor" class="custom-select">
                                <option value="RGB" selected>RGB (Digital)</option>
                                <option value="CMYK">CMYK (Impressão 300 DPI)</option>
                            </select>
                        </div>

                        <div class="input-block">
                            <label class="field-label">Cor do Texto</label>
                            <div class="color-picker-wrapper">
                                <input type="color" name="cor_hex" value="#000000" class="custom-color">
                                <span class="color-hint">Selecione a cor</span>
                            </div>
                        </div>

                        <div class="input-block">

                            <!-- Botão Aplicar -->
                            <div class="input-block">

                                <label class="field-label">&nbsp;</label>
                                <!-- Espaçador para alinhar com o campo ao lado -->
                                <button type="button" class="btn-secondary" onclick="aplicarFormatacaoNomes()">
                                    Aplicar Formatação &rarr;
                                </button>
                            </div>


                        </div>
                    </div>
                </div>

                <!-- Coluna Direita: Lista de Nomes e Ação -->
                <div class="card card-side">
                    <div class="card-header">
                        <span class="step-number">03</span>
                        <h2>Participantes</h2>
                    </div>

                    <div class="input-block">
                        <label class="field-label">Cole a lista de nomes (um por linha)</label>
                        <textarea name="nomes" id="textarea_nomes" rows="10" class="custom-textarea"
                            placeholder="Nome Completo da Silva&#10;Nome Completo Cavalcanti&#10;Nome Completo Soares"></textarea>
                    </div>

                    <button type="submit" class="btn-primary">
                        <span>Gerar Pacote ZIP</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>
            </div>

        </form>
    </main>

    <script>
        function toggleModelo(opcao) {
            document.getElementById('box-lista').style.display = opcao === 'lista' ? 'block' : 'none';
            document.getElementById('box-upload').style.display = opcao === 'upload' ? 'block' : 'none';

            if (opcao === 'lista') {
                document.getElementById('lbl-lista').classList.add('active');
                document.getElementById('lbl-upload').classList.remove('active');
            } else {
                document.getElementById('lbl-upload').classList.add('active');
                document.getElementById('lbl-lista').classList.remove('active');
            }
        }

        // Função para converter texto para Title Case (Primeiras Letras Maiúsculas)
        function toTitleCase(str) {
            return str.toLowerCase().replace(/(?:^|\s|-)\S/g, function (a) {
                return a.toUpperCase();
            });
        }

        // Função que roda EXCLUSIVAMENTE ao clicar no botão "Aplicar Formatação"
        function aplicarFormatacaoNomes() {
            const textarea = document.getElementById('textarea_nomes');
            const formato = document.getElementById('formato_nome').value;

            if (!textarea || !textarea.value.trim()) return;

            const linhas = textarea.value.split('\n');

            const linhasFormatadas = linhas.map(linha => {
                if (formato === 'upper') {
                    return linha.toUpperCase();
                } else if (formato === 'title') {
                    return toTitleCase(linha);
                }
                return linha;
            });

            textarea.value = linhasFormatadas.join('\n');
        }
    </script>
</body>

</html>
